<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
        integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap">
    <!-- Same look as the add-product form -->
    <link rel="stylesheet" href="../formPage/form.css">
    <title>Log in – PixelPursuit</title>
</head>
<body>

    <nav>
        <a id="navButton" href="../index.html">Home Page</a>
    </nav>

    <main>
        <h1 id="accountHeading">Log in</h1>

        <form id="loginForm" class="account-form">
            <label for="loginUsername">Username</label>
            <input type="text" id="loginUsername" name="username" autocomplete="username" required>

            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" name="password" autocomplete="current-password" required>

            <button id="submitButton" class="submit-button" type="submit"><span>Log in</span></button>
            <p class="form-error" role="alert"></p>
            <p class="switch-form">No account yet? <button type="button" class="link-button" data-show="register">Create one</button></p>
        </form>

        <form id="registerForm" class="account-form" hidden>
            <label for="registerUsername">Username</label>
            <input type="text" id="registerUsername" name="username" autocomplete="username" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" aria-describedby="usernameHint" required>
            <p id="usernameHint" class="field-hint">3-20 letters, numbers or _</p>

            <label for="registerPassword">Password</label>
            <input type="password" id="registerPassword" name="password" autocomplete="new-password" minlength="8" maxlength="100" aria-describedby="passwordHint" required>
            <p id="passwordHint" class="field-hint">At least 8 characters</p>

            <button id="registerButton" class="submit-button" type="submit"><span>Create account</span></button>
            <p class="form-error" role="alert"></p>
            <p class="switch-form">Already have an account? <button type="button" class="link-button" data-show="login">Log in</button></p>
        </form>
    </main>

    <script src="../auth.js"></script>
    <script src="account.js"></script>

</body>
</html>
