<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
        integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap">
    <link rel="stylesheet" href="form.css">
    <title>Add new product – PixelPursuit</title>
</head>
<body>

    <nav>
        <a id="navButton" href="../index.html">Home Page</a>
        <div class="account-links" data-base="../"></div>
    </nav>

    <main>
        <h1 id="formHeading">Submit new product</h1>
        <p id="textFilter" aria-live="polite"></p>
        <p id="formNotice" class="form-notice" hidden></p>

        <!-- Shown by form.js once we know the visitor is logged in -->
        <form id="itemForm" hidden>
            <label for="title">Title</label>
            <input type="text" id="title" name="title" maxlength="30" required>

            <label for="price">Price ($)</label>
            <input type="text" id="price" name="price" inputmode="decimal" placeholder="19.99" maxlength="6" required>

            <label for="poster">Poster URL</label>
            <input type="url" id="poster" name="poster" placeholder="https://… (600 x 800)" required>

            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4" maxlength="200" placeholder="Max 200 characters (choose words wisely)" required></textarea>

            <label for="whereToBuy">Where to Buy</label>
            <input type="text" id="whereToBuy" name="whereToBuy" placeholder="Product link or location" maxlength="70" required>

            <button id="submitButton" class="submit-button" type="submit"><span>Submit</span></button>
            <p id="formMessage" role="status"></p>
        </form>
    </main>

    <div id="screenEffect"></div>

    <script src="../auth.js"></script>
    <script src="form.js"></script>

</body>
</html>
